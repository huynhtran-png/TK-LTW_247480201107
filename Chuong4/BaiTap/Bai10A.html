<!DOCTYPE html>
<HTML>
<HEAD>
    <TITLE>Bài tập JavaScript 10A</TITLE>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
</HEAD>
<BODY>
    <h2>Bài tập JavaScript 10A: Sử dụng sự kiện OnClick trên phần tử HTML Form</h2>

    <!-- Nút 1: Thực hiện câu lệnh alert('Hello world') -->
    <p>1. Nút hiển thị hộp thoại thông báo Hello world:</p>
    <INPUT type="button" name="BtnHello" value="Nút 1 - Hello World" 
    onClick="alert('Hello world');">

    <br><br>

    <!-- Nút 2: Thực hiện câu lệnh document.write('Welcome to JavaScript') -->
    <p>2. Nút ghi nội dung lên trang web:</p>
    <INPUT type="button" name="BtnWrite" value="Nút 2 - Welcome" 
    onClick="document.write('Welcome to JavaScript');">

    <br><br>

    <!-- Nút 3: Thực hiện nhiều câu lệnh JavaScript (Tính tổng x và y) -->
    <p>3. Nút thực hiện nhiều câu lệnh JavaScript:</p>
    <INPUT type="button" name="BtnTinhTong" value="Nút 3 - Tính Tổng" 
    onClick="var x, y; x = 10; y = 20; alert('Tổng là : ' + (x + y));">

</BODY>
</HTML>
