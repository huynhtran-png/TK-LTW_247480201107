<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Nhập thông tin họ tên và năm sinh</h2>
    
    Họ tên: <INPUT type="text" id="HoTen" name="HoTen"><br><br>
    Năm sinh: <INPUT type="text" id="Namsinh" name="Namsinh"><br><br>
    
    <!-- Nút Hiển thị đọc giá trị từ HoTen và Namsinh rồi in ra trang web -->
    <INPUT type="button" name="HienThi" value="Hiển thị" 
    onClick="document.write('Họ tên: ' + HoTen.value + '<br>Năm sinh: ' + Namsinh.value);">
</body>
</html>
