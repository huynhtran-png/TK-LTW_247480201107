<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h2>Bài tập JavaScript 11B: Thay đổi màu nền với ba nút bấm</h2>
    
    <!-- Nút 1: Màu xanh dương -->
    <INPUT type="button" name="MauXanhDuong" value="Màu xanh dương"
    onClick="document.bgColor = 'blue'">

    <!-- Nút 2: Màu xanh lá -->
    <INPUT type="button" name="MauXanhLa" value="Màu xanh lá"
    onClick="document.bgColor = 'green'">

    <!-- Nút 3: Màu vàng -->
    <INPUT type="button" name="MauVang" value="Màu vàng"
    onClick="document.bgColor = 'yellow'">   
</body>
</html>
