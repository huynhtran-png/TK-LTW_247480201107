<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="JavaScript">
   
    var hoTen = prompt("Hãy nhập vào Họ tên sinh viên:");
    var lopHoc = prompt("Hãy nhập vào Lớp học:");

    
    document.write("<h1 style='color: red;'>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h1>");
    
    document.write("<h2 style='color: blue;'>KHOA CÔNG NGHỆ THÔNG TIN</h2>");
    
    document.write("<p style='font-size: 14pt; color: black; font-weight: bold;'>Lớp học: " + lopHoc + "</p>");
    
    document.write("<p style='font-size: 14pt; color: green;'>Họ tên sinh viên: " + hoTen + "</p>");
    </script>
</body>
</html>
