<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write(" Tạo Button bằng Script ");
        document.write("<br>");
        function thongbao(txt){
            alert(txt);
        }

    </script>
    <form>
        <input type="button" name="Thongbao" value="Thông Báo"
        onclick="thongbao('Welcome to javascript!')">
    </form>
</body>
</html>
