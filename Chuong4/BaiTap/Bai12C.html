<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ghép họ và tên sử dụng Textbox</h2>
    
    Họ: <INPUT type="text" id="Ho" name="Ho" value="Họ"><br><br>
    Tên: <INPUT type="text" id="Ten" name="Ten" value="Tên"><br><br>
    
    <!-- Nút Hiển thị -->
    <INPUT type="button" name="HienThi" value="Hiển thị" 
    onClick="Hoten.value = Ho.value + ' ' + Ten.value;"><br><br>
    
    Họ và tên: <INPUT type="text" id="Hoten" name="Hoten" value="">
</body>
</html>
