<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký xét tuyển</title>
</head>

<body>

<table border="1" width="700" align="center" cellspacing="0">

    <tr>
        <th align="left" bgcolor="gray">
            <b>Đăng ký dự thi</b>
        </th>
    </tr>

    <tr>
        <td>

            <table width="100%">
                <tr>

                    <td align="left">
                        <font face="Arial" size="2">
                            <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b><br>
                            KHOA KỸ THUẬT VÀ CÔNG NGHỆ
                        </font>
                    </td>

                    <td align="center">
                        <font face="Arial" size="2">
                            <b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br>
                            Độc lập - Tự do - Hạnh phúc
                        </font>
                    </td>

                </tr>
            </table>


            <h1 align="center">
                <font face="Verdana" size="5" color="red">
                    <b>ĐĂNG KÝ XÉT TUYỂN</b>
                </font>
            </h1>


            <form>

                <table align="center">

                    <tr>
                        <td>
                            <font face="Arial" size="3">
                                Họ tên :
                            </font>
                        </td>

                        <td>
                            <input type="text" name="hoten" size="25">
                        </td>
                    </tr>


                    <tr>
                        <td>
                            <font face="Arial" size="3">
                                Giới tính:
                            </font>
                        </td>

                        <td>
                            <input type="radio" name="gioitinh" value="Nam" checked>
                            Nam

                           

                            <input type="radio" name="gioitinh" value="Nu">
                            Nữ
                        </td>
                    </tr>


                    <tr>
                        <td valign="top">
                            <font face="Arial" size="3">
                                Ngành thi:
                            </font>
                        </td>

                        <td>

                            <input type="radio" name="nganh" value="CNTT" checked>
                            Công nghệ thông tin
                            <br>

                            <input type="radio" name="nganh" value="MamNon">
                            Mầm non
                            <br>

                            <input type="radio" name="nganh" value="AmNhac">
                            Âm nhạc</td>
                    </tr>


                    <tr>
                        <td></td>

                        <td>

                            <br>

                            <input type="Button" value="Đồng ý">

                            

                            <input type="Button" value="Không đồng ý">

                        </td>
                    </tr>

                </table>

            </form>

        </td>
    </tr>

</table>

</body>
</html>
